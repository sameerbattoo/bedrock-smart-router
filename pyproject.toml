[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-smart-router"
version = "0.1.0"
description = "Intelligent model routing for Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.24.0",
]
redis = [
    "redis>=5.0",
]
faiss = [
    "faiss-cpu>=1.7",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
opensearch = [
    "opensearch-py>=2.4.0",
    "requests-aws4auth>=1.2.0",
]
strands = [
    "strands-agents>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb]>=5.0",
    "strands-agents>=0.1.0",
    "faiss-cpu>=1.7.0",
    "redis>=5.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
include = ["bedrock_smart_router*"]

[tool.setuptools.package-data]
bedrock_smart_router = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]
