[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-smart-router"
version = "0.1.0"
description = "Intelligent model routing for Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb]>=5.0",
]

[tool.setuptools.package-data]
bedrock_smart_router = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
